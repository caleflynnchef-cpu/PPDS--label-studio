<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#172d47">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="PPDS Labels">
  <meta name="description" content="Private iPhone-friendly recipe and PPDS food label printer for A4 adhesive labels.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <title>PPDS Label Studio</title>
</head>
<body>
<header class="app-header">
  <div class="brand-mark" aria-hidden="true"><span class="brand-lines">▤</span></div>
  <div class="brand-copy"><div class="brand-name">PPDS <strong>Label Studio</strong></div><div class="brand-tag">Food labelling, made practical.</div></div>
  <div class="header-pill"><span class="dot"></span>On-device</div>
</header>
<nav class="nav-tabs" aria-label="Main navigation">
  <button type="button" class="tab active" data-nav="recipes"><span class="nav-emoji">▦</span> Recipes</button>
  <button type="button" class="tab" data-nav="editor"><span class="nav-emoji">✎</span> Edit label</button>
  <button type="button" class="tab" data-nav="print"><span class="nav-emoji">▤</span> Print</button>
  <button type="button" class="tab" data-nav="settings"><span class="nav-emoji">⚙</span> Settings</button>
</nav>
<main id="app" aria-live="polite"></main>
<footer class="app-footer">PPDS Label Studio · Version 1.0 · Recipes stay in this browser. Always verify the final printed label against current supplier specifications.</footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="print-root" aria-hidden="true"></div>
<script src="app.js" defer></script>
</body>
</html>
